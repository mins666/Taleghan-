name: Build Taleghan Store v7.0.0 Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "**/*.zip"
      - ".github/workflows/build-taleghan-v7.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Find Taleghan source ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(
            find . -type f \
              -iname "Taleghan_Store_v7_0_0_FINAL*.zip" \
              ! -path "./.git/*" \
              | sort
          )

          if [ "${#ZIPS[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one Taleghan source ZIP."
            echo "Found ${#ZIPS[@]} ZIP file(s):"
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          fi

          echo "ZIP_FILE=${ZIPS[0]}" >> "$GITHUB_ENV"

          echo "Using source:"
          echo "${ZIPS[0]}"

      - name: Verify ZIP integrity
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "$ZIP_FILE"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP_FILE" -d project

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find project -type f -name "settings.gradle" | sort | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail

          INDEX="$PROJECT_DIR/app/src/main/assets/index.html"
          GRADLE="$PROJECT_DIR/app/build.gradle"
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          JAVA="$PROJECT_DIR/app/src/main/java/com/taleghan/store/MainActivity.java"

          test -f "$INDEX"
          test -f "$GRADLE"
          test -f "$MANIFEST"
          test -f "$JAVA"

          echo "Required files exist."

      - name: Verify app identity
        shell: bash
        run: |
          set -euo pipefail

          GRADLE="$PROJECT_DIR/app/build.gradle"
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "Checking package ID..."

          grep -Fq "com.taleghan.store" "$GRADLE"

          echo "Checking version code..."

          grep -Fq "versionCode 700" "$GRADLE"

          echo "Checking version name..."

          grep -Eq "versionName[[:space:]]+['\"]7\.0\.0-taleghan['\"]" "$GRADLE"

          echo "Checking Persian app name..."

          grep -Fq "طالقان استور" "$MANIFEST"

          echo "Checking that incorrect spelling is absent..."

          if grep -Fq "تالقان استور" "$MANIFEST"; then
            echo "ERROR: Incorrect Persian name found."
            exit 1
          fi

          echo "App identity verification PASSED."

      - name: Verify required application features
        shell: bash
        run: |
          set -euo pipefail

          INDEX="$PROJECT_DIR/app/src/main/assets/index.html"
          JAVA="$PROJECT_DIR/app/src/main/java/com/taleghan/store/MainActivity.java"

          echo "Checking initial inventory..."

          grep -Fq "applyInitialInventoryRows" "$INDEX"
          grep -Fq "parseInventoryJSON" "$INDEX"

          echo "Checking FIFO sales logic..."

          grep -Fq "cartParts" "$INDEX"

          echo "Checking missed sale..."

          grep -Fq "saveMissedSale" "$INDEX"

          echo "Checking phone synchronization..."

          grep -Fq "PASHMAK-SHIFT-TRANSFER" "$INDEX"

          echo "Checking Android file picker..."

          grep -Fq "onShowFileChooser" "$JAVA"

          echo "Required feature verification PASSED."

      - name: JavaScript syntax check
        shell: bash
        run: |
          set -euo pipefail

          node - "$PROJECT_DIR/app/src/main/assets/index.html" <<'NODE'
          const fs = require("fs");
          const vm = require("vm");

          const file = process.argv[2];
          const html = fs.readFileSync(file, "utf8");

          const blocks = [
            ...html.matchAll(
              /<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi
            )
          ];

          if (!blocks.length) {
            throw new Error("No JavaScript blocks found.");
          }

          blocks.forEach((match, index) => {
            new vm.Script(
              match[1],
              {
                filename: `index-script-${index}.js`
              }
            );
          });

          console.log(
            `JavaScript syntax check PASSED: ${blocks.length} blocks checked.`
          );
          NODE

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle clean assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Create Release signing key
        shell: bash
        run: |
          set -euo pipefail

          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/taleghan-release.jks" \
            -storetype PKCS12 \
            -alias taleghan-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "TaleghanRelease2026!" \
            -keypass "TaleghanRelease2026!" \
            -dname "CN=Taleghan Store, OU=Store, O=Taleghan Store, L=Tehran, ST=Tehran, C=IR"

      - name: Align and sign Release APK
        shell: bash
        run: |
          set -euo pipefail

          UNSIGNED=$(find \
            "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f \
            -name "*.apk" \
            | sort \
            | head -n 1)

          if [ -z "$UNSIGNED" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          mkdir -p "$PROJECT_DIR/app/build/outputs/final"

          ALIGNED="$PROJECT_DIR/app/build/outputs/final/Taleghan_Store_v7.0.0_RELEASE_aligned.apk"

          FINAL="$PROJECT_DIR/app/build/outputs/final/Taleghan_Store_v7.0.0_RELEASE.apk"

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -f 4 \
            "$UNSIGNED" \
            "$ALIGNED"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/taleghan-release.jks" \
            --ks-key-alias taleghan-release \
            --ks-pass pass:"TaleghanRelease2026!" \
            --key-pass pass:"TaleghanRelease2026!" \
            --out "$FINAL" \
            "$ALIGNED"

          rm -f "$ALIGNED"

          echo "Release APK signed."

      - name: Verify final APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/final/Taleghan_Store_v7.0.0_RELEASE.apk"

          test -f "$APK"

          echo "Checking APK signature..."

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

          echo "Reading APK package information..."

          BADGING=$(
            "$ANDROID_HOME/build-tools/35.0.0/aapt" \
              dump badging \
              "$APK"
          )

          echo "$BADGING"

          echo "$BADGING" | \
            grep -Fq "package: name='com.taleghan.store'"

          echo "$BADGING" | \
            grep -Fq "versionCode='700'"

          echo "$BADGING" | \
            grep -Fq "versionName='7.0.0-taleghan'"

          echo "FINAL RELEASE APK VERIFICATION PASSED."

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: Taleghan-Store-v7.0.0-RELEASE
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/final/Taleghan_Store_v7.0.0_RELEASE.apk
          if-no-files-found: error
