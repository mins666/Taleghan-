name: Build Taleghan Store v7.0.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "**/*.zip"
      - ".github/workflows/build-taleghan-v7.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Find Taleghan source ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(
            find . -type f \
              -iname "Taleghan_Store_v7_0_0_FINAL*.zip" \
              ! -path "./.git/*" \
              | sort
          )

          if [ "${#ZIPS[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one Taleghan source ZIP."
            echo "Found ${#ZIPS[@]} file(s):"
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          fi

          echo "Using:"
          echo "${ZIPS[0]}"

          echo "ZIP_FILE=${ZIPS[0]}" >> "$GITHUB_ENV"

      - name: Verify ZIP integrity
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "$ZIP_FILE"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP_FILE" -d project

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find project -type f -name "settings.gradle" | sort | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"
          test -f "$PROJECT_DIR/app/src/main/java/com/taleghan/store/MainActivity.java"

          echo "Project files OK."

      - name: Static verification
        shell: bash
        run: |
          set -euo pipefail

          INDEX="$PROJECT_DIR/app/src/main/assets/index.html"
          GRADLE="$PROJECT_DIR/app/build.gradle"
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "Checking package ID..."
          grep -Fq "com.taleghan.store" "$GRADLE"

          echo "Checking version..."
          grep -Fq "versionCode 700" "$GRADLE"
          grep -Fq "versionName '7.0.0-taleghan'" "$GRADLE"

          echo "Checking app name..."
          grep -Fq "تالقان استور" "$MANIFEST"

          echo "Checking initial inventory..."
          grep -Fq "applyInitialInventoryRows" "$INDEX"
          grep -Fq "parseInventoryJSON" "$INDEX"

          echo "Checking sales FIFO..."
          grep -Fq "cartParts" "$INDEX"

          echo "Checking missed sale..."
          grep -Fq "saveMissedSale" "$INDEX"

          echo "Checking phone synchronization..."
          grep -Fq "PASHMAK-SHIFT-TRANSFER" "$INDEX"

          echo "Static verification PASSED."

      - name: JavaScript syntax check
        shell: bash
        run: |
          set -euo pipefail

          node - "$PROJECT_DIR/app/src/main/assets/index.html" <<'NODE'
          const fs = require("fs");
          const vm = require("vm");

          const html = fs.readFileSync(process.argv[2], "utf8");

          const blocks = [
            ...html.matchAll(
              /<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi
            )
          ];

          if (!blocks.length) {
            throw new Error("No JavaScript blocks found.");
          }

          blocks.forEach((match, index) => {
            new vm.Script(
              match[1],
              { filename: `index-script-${index}.js` }
            );
          });

          console.log(
            `JavaScript syntax check PASSED: ${blocks.length} blocks checked.`
          );
          NODE

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find \
            "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name "*.apk" \
            | sort \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

          BADGING=$(
            "$ANDROID_HOME/build-tools/35.0.0/aapt" \
              dump badging \
              "$APK"
          )

          echo "$BADGING"

          echo "$BADGING" | \
            grep -Fq "package: name='com.taleghan.store'"

          echo "$BADGING" | \
            grep -Fq "versionCode='700'"

          echo "$BADGING" | \
            grep -Fq "versionName='7.0.0-taleghan'"

          echo "APK verification PASSED."

      - name: Rename APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find \
            "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name "*.apk" \
            | sort \
            | head -n 1)

          cp "$APK" \
            "$PROJECT_DIR/app/build/outputs/apk/debug/Taleghan_Store_v7.0.0_FINAL.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Taleghan-Store-v7.0.0-FINAL
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/Taleghan_Store_v7.0.0_FINAL.apk
          if-no-files-found: error
